# Backend de production (branche `main`). Aucun rollout avant les critères de la section 15 du plan.
runConfig:
  minInstances: 0
  maxInstances: 20

env:
  - variable: APP_ENV
    value: production
    availability: [BUILD, RUNTIME]
  - variable: APP_ORIGIN
    value: https://REPLACE_WITH_PRODUCTION_DOMAIN
    availability: [RUNTIME]
  - variable: CONTENT_MIN_STATUS
    value: published
    availability: [BUILD, RUNTIME]
  - variable: LAB_MIN_STATUS
    value: validated
    availability: [BUILD, RUNTIME]
  - variable: APP_CHECK_ENFORCED
    value: 'true'
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY
    value: REPLACE_WITH_PRODUCTION_RECAPTCHA_SITE_KEY
    availability: [BUILD]
  - variable: SQL_SERVER_GRADING_ENABLED
    value: 'false'
    availability: [RUNTIME]
